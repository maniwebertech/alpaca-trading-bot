name: Gold Breakout bot (GLD, 24/5)

# Runs gold_bot.py on its own Alpaca paper account (secrets GOLD_ALPACA_API_KEY / GOLD_ALPACA_SECRET_KEY).
# GitHub limits one job to 6 hours, so each run trades 5h50m and exits; the schedule starts the next one.
# Only one run trades at a time, enforced by a HEARTBEAT LOCK in gold_bot.py (not by a GitHub concurrency
# group): the active run refreshes a heartbeat every 30 s; the run cron starts every minute exits within
# seconds while the heartbeat is fresh, and takes over when it is older than 90 s. So when GitHub loses a
# runner (happened 2026-11-23: 70 min unwatched while GitHub waited to declare the dead run failed),
# the bot is back within ~2 minutes. A new run rebuilds its state from Alpaca (position, stop, today's trade).
#
# NOTE: the stop loss is watched by the bot (Alpaca has no stop orders outside 9:30-16:00 ET).
# Public repository: GitHub Actions minutes are free.

on:
  # Started every minute by 3 cron-job.org jobs (Sun 18:00 ET Asian open -> Fri 17:00 ET NY close):
  #   "Gold bot - Sun from Asian open 18:00", "Gold bot - Mon-Thu all day", "Gold bot - Fri until NY close 17:00"
  #   POST .../gold-bot.yml/dispatches  body {"ref":"main","inputs":{"mode":"trade"}}
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: check
        options:
          - check      # print range / price / plan once, never sends orders
          - dry-run    # run 5h50m, log decisions only
          - trade      # run 5h50m and trade

permissions:
  contents: write

env:
  GOLD_ALPACA_API_KEY: ${{ secrets.GOLD_ALPACA_API_KEY }}
  GOLD_ALPACA_SECRET_KEY: ${{ secrets.GOLD_ALPACA_SECRET_KEY }}
  GOLD_ALPACA_PAPER: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run gold bot
        run: |
          MODE="${{ github.event_name == 'schedule' && 'trade' || inputs.mode }}"
          case "$MODE" in
            check)   python gold_bot.py --check ;;
            dry-run) python gold_bot.py --hours 5.83 --dry-run ;;
            *)       python gold_bot.py --hours 5.83 ;;
          esac
      - name: Save logs
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add logs/ 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Gold bot log $(TZ=America/New_York date '+%F %H:%M') ET"; git pull --rebase; git push; }
